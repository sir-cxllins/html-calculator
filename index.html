<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> my first html calculator</title>
  </head>
  <body>
    <h2>HTML CALCULATOR</h2>
    <form>
      <!-- first number input -->
      <input type="number" placeholder="Enter fisrt number"><br><br>

      <!--operation numbers -->
      <button type="button">+</button>
       <button type="button">-</button>
       <button type="button">*</button>
       <button type="button">/</button>

      <!-- second number input -->
      <input type="number" placeholder="Enter second number"><br><br>

      <!-- Result field -->
      <label>Result:</label>
      <input type="text" readonly value="0">
    </form>
  </body>
</html>
